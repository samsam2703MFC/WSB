name: Nouveau serveur (wsm)

# Le NOUVEAU serveur multi-boutiques (serveur/README.md). L'ancien serveur
# garde son propre déploiement (deploy.yml) tant qu'il tourne.
#
#   push sur main  → nouvelle version du code, déployée sur la boutique « sandbox »
#   Actions → « Nouveau serveur (wsm) » → Run workflow :
#       valider    → la version de la sandbox passe sur TOUTES les boutiques
#       deployer   → une boutique précise (champ « boutique »)
#       retour     → une boutique revient à sa version précédente
#       liste      → l'état du serveur
#
# Secrets (Settings → Secrets and variables → Actions) :
#   NOWY_SERWER_HOST   adresse IP ou nom du serveur
#   NOWY_SERWER_KLUCZ  clé SSH PRIVÉE de l'utilisateur wsm-deploy (sa moitié publique
#                      est sur le serveur, posée par serveur/installer.sh --cle)
# Variable facultative : NOWY_SERWER_PORT (22 par défaut).
#
# OU, à défaut, les secrets de l'ancien déploiement SSH_HOST / SSH_USER /
# SSH_PASSWORD (+ variable SSH_PORT) : GitHub se connecte alors avec ce compte
# et lance serveur/amorcer.sh, qui installe le serveur s'il est VIERGE et crée
# la boutique « sandbox » (sandbox.<ip>.sslip.io) au premier passage.
# Variable facultative WSM_EMAIL : l'e-mail administrateur (consoles, Let's Encrypt).
#
# Le siège BuddyCorp (superadmin, clés de toutes les boutiques) :
#   secret SIEGE_TELEFONY   les numéros autorisés, ex. « +48600100200, +32470111222 »
#   secret SMSAPI_TOKEN     le jeton OAuth SMSAPI du siège (envoi du code de connexion)
#   variable SMSAPI_NADAWCA le nom d'expéditeur validé chez SMSAPI (facultatif)
#   variable SIEGE_DOMAINE  son domaine (défaut : admin.<ip>.sslip.io)
# Ils passent par un fichier déposé puis effacé sur le serveur, jamais par la
# ligne de commande ni par le journal.
#
# wsm-deploy ne peut lancer QUE wsm, et seulement version / deployer / valider /
# liste / sante / retour : une clé volée ne crée ni ne supprime rien.

on:
  push:
    # main : le flux normal. La branche de travail : le temps de mettre le
    # nouveau serveur en route sans passer par main — à retirer après fusion.
    branches: [main, claude/wizardly-cori-jqdkt7]
  workflow_dispatch:
    inputs:
      action:
        description: "Que faire"
        type: choice
        options: [mettre-a-jour, valider, deployer, retour, liste]
        default: liste
      boutique:
        description: "Boutique (pour deployer / retour)"
        required: false
        default: ""
      afficher_adresse:
        description: "Afficher les adresses des sites en clair (le journal est PUBLIC)"
        type: boolean
        default: false

concurrency:
  group: nouveau-serveur
  cancel-in-progress: false

jobs:
  wsm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Le serveur est-il configuré ?
        id: pret
        env:
          HOST: ${{ secrets.NOWY_SERWER_HOST }}
          KLUCZ: ${{ secrets.NOWY_SERWER_KLUCZ }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          if [ -n "$HOST" ] && [ -n "$KLUCZ" ]; then
            echo "Accès par clé (wsm-deploy)."; echo "mode=cle" >> "$GITHUB_OUTPUT"
          elif [ -n "$SSH_HOST" ] && [ -n "$SSH_PASSWORD" ]; then
            echo "Accès par mot de passe (SSH_HOST / SSH_USER / SSH_PASSWORD)."; echo "mode=mdp" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun accès au serveur dans les secrets : rien à faire (voir serveur/README.md)."
            echo "mode=" >> "$GITHUB_OUTPUT"
          fi

      # ── Accès par mot de passe : amorcer.sh fait tout, en root (installation
      #    si le serveur est vierge, version, sandbox, déploiement).
      - name: Exécuter (mot de passe)
        if: steps.pret.outputs.mode == 'mdp'
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          HOST: ${{ secrets.SSH_HOST }}
          USR: ${{ secrets.SSH_USER }}
          PORT: ${{ vars.SSH_PORT || '22' }}
          EMAIL: ${{ vars.WSM_EMAIL || 'admin@example.pl' }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
          BOUTIQUE: ${{ inputs.boutique }}
          SHA: ${{ github.sha }}
          BRANCHE: ${{ github.ref_name }}
          SIEGE_TELEFONY: ${{ secrets.SIEGE_TELEFONY }}
          SMSAPI_TOKEN: ${{ secrets.SMSAPI_TOKEN }}
          SMSAPI_NADAWCA: ${{ vars.SMSAPI_NADAWCA }}
          SIEGE_DOMAINE: ${{ vars.SIEGE_DOMAINE }}
          AFFICHER: ${{ inputs.afficher_adresse }}
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          USR="${USR:-root}"
          O=(-p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=30)
          IP=$(getent ahostsv4 "$HOST" | awk 'NR==1{print $1}')
          # Le journal est public : l'adresse du serveur n'y apparaît sous aucune forme.
          # (Sauf demande explicite « afficher_adresse » : alors les adresses des
          #  sites — l'IP avec des tirets — s'affichent en clair à la fin.)
          echo "::add-mask::$IP"; [ "$AFFICHER" = true ] || echo "::add-mask::${IP//./-}"
          if [ "$EVENT" = push ]; then A=push; else A="${ACTION:-liste}"; fi
          [ "$A" = mettre-a-jour ] && A=push
          case "${SIEGE_DOMAINE:-}" in ''|*[!a-z0-9.-]*) SIEGE_DOMAINE="";; esac
          ( umask 077
            printf 'SIEGE_TELEFONY=%s\nSMSAPI_TOKEN=%s\nSMSAPI_NADAWCA=%s\n' \
              "$(printf '%s' "$SIEGE_TELEFONY" | tr -d '\r\n')" "$(printf '%s' "$SMSAPI_TOKEN" | tr -d '\r\n')" \
              "$(printf '%s' "$SMSAPI_NADAWCA" | tr -d '\r\n')" > "$RUNNER_TEMP/wsb-secrets.env" )
          if [ "$A" = deployer ] || [ "$A" = retour ]; then
            [[ "$BOUTIQUE" =~ ^[a-z0-9][a-z0-9-]{1,30}$ ]] || { echo "boutique invalide"; exit 1; }
          fi
          sshpass -e scp -P "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            serveur/amorcer.sh serveur/installer.sh serveur/wsm "$RUNNER_TEMP/wsb-secrets.env" "$USR@$HOST:/tmp/"
          rm -f "$RUNNER_TEMP/wsb-secrets.env"
          # root : directement ; sinon sudo, le mot de passe sur l'entrée standard.
          ARGS="--branche '$BRANCHE' --sha '$SHA' --email '$EMAIL' --ip '$IP' --action '$A' --boutique '$BOUTIQUE' --siege-domaine '$SIEGE_DOMAINE'"
          printf '%s\n' "$SSHPASS" | sshpass -e ssh "${O[@]}" "$USR@$HOST" \
            "if [ \$(id -u) = 0 ]; then bash /tmp/amorcer.sh $ARGS </dev/null; else sudo -S -p '' bash /tmp/amorcer.sh $ARGS; fi"
          if [ "$A" = push ]; then
            for site in sandbox:shop admin:siege; do
              h="${site%%:*}"; [ "$h" = admin ] && [ -n "$SIEGE_DOMAINE" ] && continue
              URL="https://$h.${IP//./-}.sslip.io/${site#*:}/"
              # Routage (certificat ignoré) puis certificat : le premier
              # certificat Let's Encrypt peut prendre une minute ou deux.
              r=000; c=000
              for i in $(seq 1 18); do
                r=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 "$URL" || true)
                c=$(curl -s  -o /dev/null -w '%{http_code}' --max-time 15 "$URL" || true)
                [ "$c" != 000 ] && break; sleep 10
              done
              ADR="https://$h.<IP avec des tirets>.sslip.io/${site#*:}/"; [ "$AFFICHER" = true ] && ADR="$URL"
              echo "$h : $ADR → routage HTTP $r, certificat $([ "$c" != 000 ] && echo "valide (HTTP $c)" || echo "pas encore valide")"
            done
            ipc=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "http://$IP/backoffice/login.php" || true)
            echo "console par l'IP : http://<IP>/backoffice → HTTP $ipc"
          fi

      # ── Accès par clé : wsm-deploy ne peut lancer QUE wsm (version, deployer,
      #    valider, liste, sante, retour).
      - name: Clé SSH
        if: steps.pret.outputs.mode == 'cle'
        env:
          KLUCZ: ${{ secrets.NOWY_SERWER_KLUCZ }}
          HOST: ${{ secrets.NOWY_SERWER_HOST }}
          PORT: ${{ vars.NOWY_SERWER_PORT || '22' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KLUCZ" > ~/.ssh/wsm && chmod 600 ~/.ssh/wsm
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Exécuter (clé)
        if: steps.pret.outputs.mode == 'cle'
        env:
          HOST: ${{ secrets.NOWY_SERWER_HOST }}
          PORT: ${{ vars.NOWY_SERWER_PORT || '22' }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
          BOUTIQUE: ${{ inputs.boutique }}
          SHA: ${{ github.sha }}
        run: |
          s() { ssh -i ~/.ssh/wsm -p "$PORT" -o BatchMode=yes "wsm-deploy@$HOST" "$@"; }
          if [ "$EVENT" = push ]; then
            s sudo /usr/local/sbin/wsm version "$SHA"
            if s sudo /usr/local/sbin/wsm liste | awk '{print $1}' | grep -qx sandbox; then
              s sudo /usr/local/sbin/wsm deployer sandbox
            else
              echo "Pas de boutique « sandbox » : version construite, rien déployé."
            fi
            exit 0
          fi
          case "$ACTION" in
            valider)  s sudo /usr/local/sbin/wsm valider ;;
            deployer) [[ "$BOUTIQUE" =~ ^[a-z0-9][a-z0-9-]{1,30}$ ]] || { echo "boutique invalide"; exit 1; }
                      s sudo /usr/local/sbin/wsm deployer "$BOUTIQUE" ;;
            retour)   [[ "$BOUTIQUE" =~ ^[a-z0-9][a-z0-9-]{1,30}$ ]] || { echo "boutique invalide"; exit 1; }
                      s sudo /usr/local/sbin/wsm retour "$BOUTIQUE" ;;
            *)        s sudo /usr/local/sbin/wsm liste ;;
          esac
