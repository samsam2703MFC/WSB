# =============================================================================
#  Modèle du site Apache d'UNE boutique — rempli par `wsm creer`, réécrit par
#  `wsm apache <boutique>`. Ne pas éditer le fichier généré à la main.
#
#  Le CODE est celui de la version en vigueur (lien « current » vers
#  /srv/webshops/releases/<version>/site), partagé avec les autres boutiques.
#  Ce qui appartient à CETTE boutique est donné au code par trois variables :
#    WSM_CONFIG_FILE  accès à sa base, ses clés, son design system
#    WSM_DATA_DIR     journal d'erreurs, factures reçues
#    WSM_MEDIA_DIR    ses photos, servies sous /shop/media/
# =============================================================================
<VirtualHost *:80>
    ServerName __DOMAINE__
    __ALIAS__
    DocumentRoot __BOUTIQUE__/current

    SetEnv WSM_CONFIG_FILE __BOUTIQUE__/config.php
    SetEnv WSM_DATA_DIR    __BOUTIQUE__/data
    SetEnv WSM_MEDIA_DIR   __BOUTIQUE__/media

    <Directory __BOUTIQUE__/current>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Les photos : servies, jamais exécutées.
    Alias /shop/media/ __BOUTIQUE__/media/
    <Directory __BOUTIQUE__/media>
        Options -Indexes
        AllowOverride None
        Require all granted
        php_admin_flag engine off
        RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .php8 .phps .cgi .pl .py
        <FilesMatch "\.(php|phtml|php[0-9]|phps|cgi|pl|py|sh|htaccess)$">
            Require all denied
        </FilesMatch>
        <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set Cache-Control "public, max-age=31536000, immutable"
        </IfModule>
    </Directory>

    # « / » mène à la boutique.
    RedirectMatch 302 ^/$ /shop/

    ErrorLog ${APACHE_LOG_DIR}/wsm-__INSTANCE__-error.log
    CustomLog ${APACHE_LOG_DIR}/wsm-__INSTANCE__-access.log combined
</VirtualHost>
